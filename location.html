<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوکیشن فروشگاه | طلای سرافراز</title>
<meta name="description" content="آدرس و موقعیت فروشگاه طلای سرافراز روی نقشه." />
<link rel="canonical" href="https://example.com/location.html" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="app-header"></div>
<main>
  <section class="section" style="padding-top:56px;">
    <div class="container">
      <div class="eyebrow">لوکیشن فروشگاه</div>
      <h1 style="font-size:30px; margin-bottom:24px;">آدرس ما روی نقشه</h1>
      <p id="address-text" style="color:var(--text-muted); margin-bottom:20px;"></p>
      <div style="border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;">
        <iframe id="map-frame" width="100%" height="420" style="border:0;" loading="lazy"></iframe>
      </div>
    </div>
  </section>
</main>
<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/layout.js"></script>
<script>
mountLayout('location');
(async () => {
  const { data: s } = await window.supabaseClient.from('site_settings').select('*').eq('id', 1).single();
  document.getElementById('address-text').textContent = s?.address || 'آدرس هنوز از پنل مدیریت تنظیم نشده است.';
  const lat = s?.location_lat || 35.6892;
  const lng = s?.location_lng || 51.3890;
  document.getElementById('map-frame').src = `https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed`;
})();
</script>
</body>
</html>
