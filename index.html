<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>داشبورد | پنل مدیریت</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-mount"></div>
  <main class="admin-main">
    <h1>داشبورد</h1>
    <div class="stat-cards" id="stat-cards">
      <div class="stat-card"><div class="label">سفارش‌های امروز</div><div class="value">—</div></div>
      <div class="stat-card"><div class="label">درآمد این ماه</div><div class="value">—</div></div>
      <div class="stat-card"><div class="label">محصولات فعال</div><div class="value">—</div></div>
      <div class="stat-card"><div class="label">سفارش‌های در انتظار</div><div class="value">—</div></div>
    </div>
    <h2 style="font-size:17px; margin-bottom:16px;">آخرین سفارش‌ها</h2>
    <table class="admin-table" id="recent-orders">
      <thead><tr><th>شماره سفارش</th><th>مشتری</th><th>نوع</th><th>مبلغ</th><th>وضعیت</th></tr></thead>
      <tbody><tr><td colspan="5" style="text-align:center; color:var(--text-muted);">در حال بارگذاری...</td></tr></tbody>
    </table>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/gold-price.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="js/admin-guard.js"></script>
<script>
(async () => {
  const profile = await requireAdmin();
  if (!profile) return;
  mountAdminLayout('dashboard');

  const statusLabels = { pending:'در انتظار', confirmed:'تایید شده', processing:'در حال پردازش', shipped:'ارسال شده', completed:'تکمیل شده', cancelled:'لغو شده' };

  const { data: orders } = await window.supabaseClient.from('orders').select('*').order('created_at', { ascending: false }).limit(200);
  const { data: products } = await window.supabaseClient.from('products').select('id').eq('is_active', true);

  const todayStr = new Date().toISOString().slice(0, 10);
  const todayOrders = (orders || []).filter((o) => o.created_at.slice(0, 10) === todayStr);
  const monthStr = new Date().toISOString().slice(0, 7);
  const monthRevenue = (orders || []).filter((o) => o.created_at.slice(0, 7) === monthStr && o.status !== 'cancelled')
    .reduce((s, o) => s + Number(o.total_amount), 0);
  const pending = (orders || []).filter((o) => o.status === 'pending').length;

  const cards = document.querySelectorAll('.stat-card .value');
  cards[0].textContent = todayOrders.length.toLocaleString('fa-IR');
  cards[1].textContent = GoldPrice.formatToman(monthRevenue);
  cards[2].textContent = (products || []).length.toLocaleString('fa-IR');
  cards[3].textContent = pending.toLocaleString('fa-IR');

  const tbody = document.querySelector('#recent-orders tbody');
  const recent = (orders || []).slice(0, 10);
  tbody.innerHTML = recent.length
    ? recent.map(o => `
      <tr>
        <td>${o.order_number}</td>
        <td>${o.customer_name}</td>
        <td>${o.purchase_type === 'in_person' ? 'حضوری' : 'غیرحضوری'}</td>
        <td>${GoldPrice.formatToman(o.total_amount)}</td>
        <td>${statusLabels[o.status] || o.status}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">سفارشی ثبت نشده است.</td></tr>';
})();
</script>
</body>
</html>
