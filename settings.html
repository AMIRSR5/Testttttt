<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تنظیمات سایت | پنل مدیریت</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-mount"></div>
  <main class="admin-main">
    <h1>تنظیمات سایت</h1>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:1000px;">
      <div class="form-card" style="max-width:100%;">
        <h3 style="font-size:15px; margin-bottom:18px;">اطلاعات فروشگاه</h3>
        <div class="field"><label>شماره تماس</label><input id="s-phone"></div>
        <div class="field"><label>ایمیل</label><input id="s-email"></div>
        <div class="field"><label>آدرس</label><textarea id="s-address" rows="2"></textarea></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="field"><label>عرض جغرافیایی (lat)</label><input id="s-lat" type="number" step="0.000001"></div>
          <div class="field"><label>طول جغرافیایی (lng)</label><input id="s-lng" type="number" step="0.000001"></div>
        </div>
        <div class="field"><label>آیدی اینستاگرام (بدون @)</label><input id="s-instagram"></div>
        <div class="field"><label>ساعات کاری</label><input id="s-hours"></div>
        <div class="field"><label>متن درباره ما</label><textarea id="s-about" rows="4"></textarea></div>
        <div class="field"><label>متن قوانین و شرایط</label><textarea id="s-terms" rows="4"></textarea></div>
        <button class="btn btn-primary" id="save-site-btn">ذخیره اطلاعات فروشگاه</button>
      </div>

      <div>
        <div class="form-card" style="max-width:100%; margin-bottom:24px;">
          <h3 style="font-size:15px; margin-bottom:18px;">اتصال روبیکا</h3>
          <div class="field"><label><input type="checkbox" id="r-enabled" style="width:auto; margin-left:8px;">اتصال روبیکا فعال باشد</label></div>
          <div class="field"><label>آیدی چت/کانال مقصد در روبیکا</label><input id="r-chat-id"></div>
          <p style="font-size:12.5px; color:var(--text-muted); margin-top:-8px;">توکن ربات هرگز اینجا وارد نمی‌شود؛ به‌صورت Secret روی Supabase تنظیم می‌شود (به README مراجعه کنید).</p>
          <button class="btn btn-primary" id="save-rubika-btn">ذخیره تنظیمات روبیکا</button>
        </div>

        <div class="form-card" style="max-width:100%;">
          <h3 style="font-size:15px; margin-bottom:18px;">دسترسی ادمین</h3>
          <div class="field"><label>ایمیل کاربری که می‌خواهید ادمین شود</label><input id="admin-email"></div>
          <button class="btn btn-outline" id="grant-admin-btn">اعطای دسترسی ادمین</button>
          <p style="font-size:12px; color:var(--text-muted); margin-top:10px;">کاربر باید قبلاً در سایت ثبت‌نام کرده باشد.</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="js/admin-guard.js"></script>
<script>
async function loadSiteSettings() {
  const { data: s } = await window.supabaseClient.from('site_settings').select('*').eq('id', 1).single();
  document.getElementById('s-phone').value = s?.phone || '';
  document.getElementById('s-email').value = s?.email || '';
  document.getElementById('s-address').value = s?.address || '';
  document.getElementById('s-lat').value = s?.location_lat || '';
  document.getElementById('s-lng').value = s?.location_lng || '';
  document.getElementById('s-instagram').value = s?.instagram_id || '';
  document.getElementById('s-hours').value = s?.working_hours || '';
  document.getElementById('s-about').value = s?.about_us || '';
  document.getElementById('s-terms').value = s?.terms_content || '';

  const { data: r } = await window.supabaseClient.from('rubika_settings').select('*').eq('id', 1).single();
  document.getElementById('r-enabled').checked = r?.is_enabled || false;
  document.getElementById('r-chat-id').value = r?.destination_chat_id || '';
}

async function saveSite() {
  const btn = document.getElementById('save-site-btn');
  UI.setLoading(btn, true);
  try {
    const { error } = await window.supabaseClient.from('site_settings').update({
      phone: document.getElementById('s-phone').value.trim(),
      email: document.getElementById('s-email').value.trim(),
      address: document.getElementById('s-address').value.trim(),
      location_lat: Number(document.getElementById('s-lat').value) || null,
      location_lng: Number(document.getElementById('s-lng').value) || null,
      instagram_id: document.getElementById('s-instagram').value.trim(),
      working_hours: document.getElementById('s-hours').value.trim(),
      about_us: document.getElementById('s-about').value.trim(),
      terms_content: document.getElementById('s-terms').value.trim(),
    }).eq('id', 1);
    if (error) throw error;
    UI.toast('اطلاعات فروشگاه ذخیره شد');
  } catch (e) { UI.toast('خطا در ذخیره', 'error'); console.error(e); }
  finally { UI.setLoading(btn, false); }
}

async function saveRubika() {
  const btn = document.getElementById('save-rubika-btn');
  UI.setLoading(btn, true);
  try {
    const { error } = await window.supabaseClient.from('rubika_settings').update({
      is_enabled: document.getElementById('r-enabled').checked,
      destination_chat_id: document.getElementById('r-chat-id').value.trim(),
      updated_at: new Date().toISOString(),
    }).eq('id', 1);
    if (error) throw error;
    UI.toast('تنظیمات روبیکا ذخیره شد');
  } catch (e) { UI.toast('خطا در ذخیره', 'error'); console.error(e); }
  finally { UI.setLoading(btn, false); }
}

async function grantAdmin() {
  UI.toast('برای امنیت بیشتر، تغییر نقش کاربر باید مستقیماً از SQL Editor پنل Supabase انجام شود (به README مراجعه کنید).', 'error');
}

(async () => {
  const profile = await requireAdmin();
  if (!profile) return;
  mountAdminLayout('settings');
  await loadSiteSettings();
  document.getElementById('save-site-btn').addEventListener('click', saveSite);
  document.getElementById('save-rubika-btn').addEventListener('click', saveRubika);
  document.getElementById('grant-admin-btn').addEventListener('click', grantAdmin);
})();
</script>
</body>
</html>
