<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مدیریت گردونه شانس | پنل مدیریت</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-layout">
  <div id="admin-sidebar-mount"></div>
  <main class="admin-main">
    <div class="admin-toolbar">
      <h1 style="margin:0;">گردونه شانس</h1>
      <label style="display:flex; align-items:center; gap:10px; font-size:14px;">
        <input type="checkbox" id="wheel-enabled" style="width:auto;"> گردونه فعال باشد
      </label>
    </div>

    <div class="admin-toolbar">
      <h2 style="font-size:16px; margin:0;">جوایز</h2>
      <button class="btn btn-primary" id="add-prize-btn">+ افزودن جایزه</button>
    </div>
    <table class="admin-table">
      <thead><tr><th>عنوان</th><th>توضیحات</th><th>وزن احتمال</th><th>فعال</th><th></th></tr></thead>
      <tbody id="prizes-tbody"><tr><td colspan="5" style="text-align:center; color:var(--text-muted);">در حال بارگذاری...</td></tr></tbody>
    </table>

    <h2 style="font-size:16px; margin:32px 0 16px;">تاریخچه چرخش‌ها</h2>
    <table class="admin-table">
      <thead><tr><th>جایزه</th><th>تاریخ</th></tr></thead>
      <tbody id="spins-tbody"><tr><td colspan="2" style="text-align:center; color:var(--text-muted);">در حال بارگذاری...</td></tr></tbody>
    </table>
  </main>
</div>

<div class="modal-overlay" id="prize-modal">
  <div class="modal-box">
    <h2 style="font-size:17px; margin-bottom:16px;">افزودن جایزه</h2>
    <div class="field"><label>عنوان جایزه</label><input id="prize-title"></div>
    <div class="field"><label>توضیحات</label><textarea id="prize-desc" rows="2"></textarea></div>
    <div class="field"><label>وزن احتمال (عدد بزرگ‌تر = شانس بیشتر)</label><input id="prize-weight" type="number" value="1"></div>
    <div style="display:flex; gap:12px;">
      <button class="btn btn-primary" id="save-prize-btn">ذخیره</button>
      <button class="btn btn-ghost" onclick="document.getElementById('prize-modal').classList.remove('show')">انصراف</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="js/admin-guard.js"></script>
<script>
async function loadPrizes() {
  const { data } = await window.supabaseClient.from('wheel_prizes').select('*').order('sort_order');
  document.getElementById('prizes-tbody').innerHTML = (data || []).length
    ? data.map(p => `
      <tr>
        <td>${p.title}</td><td>${p.description || '—'}</td><td>${p.probability_weight}</td>
        <td><input type="checkbox" ${p.is_active ? 'checked' : ''} onchange="togglePrize('${p.id}', this.checked)"></td>
        <td><button class="btn btn-ghost" style="color:var(--danger)" onclick="deletePrize('${p.id}')">حذف</button></td>
      </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center; color:var(--text-muted)">جایزه‌ای ثبت نشده است.</td></tr>';
}
async function togglePrize(id, val) {
  await window.supabaseClient.from('wheel_prizes').update({ is_active: val }).eq('id', id);
}
async function deletePrize(id) {
  if (!confirm('این جایزه حذف شود؟')) return;
  await window.supabaseClient.from('wheel_prizes').delete().eq('id', id);
  loadPrizes();
}
async function loadSpins() {
  const { data } = await window.supabaseClient.from('wheel_spins').select('*').order('spun_at', { ascending: false }).limit(50);
  document.getElementById('spins-tbody').innerHTML = (data || []).length
    ? data.map(s => `<tr><td>${s.prize_title_snapshot || '—'}</td><td>${new Date(s.spun_at).toLocaleString('fa-IR')}</td></tr>`).join('')
    : '<tr><td colspan="2" style="text-align:center; color:var(--text-muted)">چرخشی ثبت نشده است.</td></tr>';
}
async function loadWheelSettings() {
  const { data } = await window.supabaseClient.from('wheel_settings').select('*').eq('id', 1).single();
  document.getElementById('wheel-enabled').checked = data?.is_enabled ?? true;
}
(async () => {
  const profile = await requireAdmin();
  if (!profile) return;
  mountAdminLayout('wheel');
  await Promise.all([loadPrizes(), loadSpins(), loadWheelSettings()]);

  document.getElementById('wheel-enabled').addEventListener('change', async (e) => {
    await window.supabaseClient.from('wheel_settings').update({ is_enabled: e.target.checked }).eq('id', 1);
    UI.toast('تنظیمات گردونه ذخیره شد');
  });
  document.getElementById('add-prize-btn').addEventListener('click', () => document.getElementById('prize-modal').classList.add('show'));
  document.getElementById('save-prize-btn').addEventListener('click', async () => {
    const title = document.getElementById('prize-title').value.trim();
    if (!title) { UI.toast('عنوان جایزه الزامی است', 'error'); return; }
    const { error } = await window.supabaseClient.from('wheel_prizes').insert({
      title, description: document.getElementById('prize-desc').value.trim(),
      probability_weight: Number(document.getElementById('prize-weight').value) || 1,
    });
    if (error) { UI.toast('خطا در ذخیره', 'error'); return; }
    document.getElementById('prize-modal').classList.remove('show');
    loadPrizes();
  });
})();
</script>
</body>
</html>
